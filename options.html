<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>非表示にした商品</title><link rel="stylesheet" href="manager.css"></head>
<body>
  <main>
    <header><p class="eyebrow">ヤフオク 商品非表示</p><h1>非表示にした商品</h1><p>解除すると、開いている検索結果にも反映されます。</p></header>
    <label for="filter">商品名・オークションIDで絞り込み</label>
    <input id="filter" type="search" placeholder="商品名またはIDを入力" autocomplete="off">
    <p id="count" role="status">読み込み中…</p>
    <p id="message" role="status"></p>
    <div id="items"></div>
    <footer>設定はこのブラウザに保存されます。新しいIDでの再出品は別商品として扱います。</footer>
  </main>
  <script src="common.js"></script><script src="manager.js"></script>
</body></html>
